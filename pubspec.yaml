name: nct_universe
description: NCT Universe - aplikasi katalog dan informasi unit NCT berbasis Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/units/
    - assets/images/members/
    - assets/images/albums/
